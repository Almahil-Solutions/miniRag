# ============================================================
# miniRAG — Nginx Reverse Proxy Configuration (TLS Hardened)
# ============================================================

# ── HTTP to HTTPS Redirect ───────────────────────────────────
server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

# ── HTTPS Server (TLS Termination) ───────────────────────────
server {
    listen 443 ssl;
    server_name _;

    # TLS Certificates
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    # Request Limits & Timeouts
    client_max_body_size 50M;
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 65s;

    # ── Application Proxy ────────────────────────────────────
    # Route API and Documentation to the FastAPI backend

    # ── SSE / Streaming endpoint (answer) ───────────────────
    # Proxy buffering MUST be disabled for Server-Sent Events, otherwise
    # Nginx buffers the entire LLM stream and the client never receives
    # tokens until the request times out.  proxy_read_timeout is raised
    # to 300 s to accommodate long LLM responses.
    location ~ ^/api/v1/nlp/index/answer/ {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable all buffering so SSE tokens are flushed immediately
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        keepalive_timeout 300s;
        # Prevent gzip from re-buffering the stream
        gzip off;
    }

    location ~ ^/(api/|docs|openapi\.json|redoc) {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route all other requests to the Frontend application
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}