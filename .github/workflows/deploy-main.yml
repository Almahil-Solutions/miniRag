name: Deploy Main Branch to Server


on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_MAIN_HOST_IP }}
          username: github_user
          key: ${{ secrets.SSH_MAIN_PRIVATE_KEY }}
          script: |
            cd /home/github_user/workspace/miniRag
            git checkout main
            git pull
            sudo systemctl restart minirag.service
            echo "Waiting..."
            sleep 40

            for i in {1..5}; do
              if ss -tuln | grep ":80"; then
                echo "Port 80 is open!"
                exit 0
              else
                echo "Port 80 is not open, retrying in 5 seconds..."
                sleep 5
              fi
            done

            if ! ss -tuln | grep ":80"; then
              echo "Service failed to start on port 80."
              exit 1
            fi

            


